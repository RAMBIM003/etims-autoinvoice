<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receipt | eTIMS AutoInvoice</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: Inter, Arial, sans-serif; background: #f6f7f9; color: #17191d; margin: 0; padding: 24px 12px; }
    .receipt { max-width: 680px; margin: 0 auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 28px; }
    .brand { text-align: center; border-bottom: 1px dashed #d1d5db; padding-bottom: 16px; margin-bottom: 16px; }
    .brand h1 { font-size: 20px; margin: 0 0 4px; }
    .brand .pin { color: #6b7280; font-size: 13px; }
    .tag { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 99px; background: #fde8ea; color: #c7192e; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13px; margin-bottom: 16px; }
    .meta span { color: #6b7280; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: #6b7280; font-size: 11px; text-transform: uppercase; padding: 8px 4px; border-bottom: 1px solid #e5e7eb; }
    td { padding: 8px 4px; border-bottom: 1px solid #f1f2f4; }
    .num { text-align: right; white-space: nowrap; }
    .totals { margin: 14px 0; font-size: 14px; }
    .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
    .totals .grand { font-size: 18px; font-weight: 700; border-top: 1px solid #e5e7eb; margin-top: 6px; padding-top: 8px; }
    .kra { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; font-size: 12px; margin-top: 16px; }
    .kra b { display: block; margin-bottom: 8px; font-size: 13px; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; word-break: break-all; }
    .qr { display: flex; justify-content: center; margin-top: 16px; }
    .error { color: #b42318; text-align: center; padding: 30px 10px; }
    .actions { max-width: 680px; margin: 14px auto 0; text-align: center; }
    .actions button { background: #c7192e; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    @media print { body { background: #fff; padding: 0; } .receipt { border: 0; } .actions { display: none; } }
</style>
</head>
<body>
<article class="receipt" id="receipt">Loading receipt...</article>
<div class="actions" id="actions" hidden>
    <button onclick="window.print()">Print / Save as PDF</button>
</div>
<script src="js/qrcode.min.js"></script>
<script src="js/api.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
