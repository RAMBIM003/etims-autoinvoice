<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My purchases | eTIMS AutoInvoice</title>
<!-- Same stylesheets as the merchant dashboard, so both sides match -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/merchant.css">
<script src="js/theme.js"></script>
<style>
    /* Buyer-only additions */
    .badge.pin{background:var(--line-inverse);color:var(--on-inverse-2)}
    .primary.sm{padding:6px 11px;font-size:12px;border-radius:var(--r-sm)}
    .lk{max-width:680px}
    .lk p{margin:0 0 10px;font-size:14px;line-height:1.55}
    .lk-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
    .lk-row input[type=text]{flex:1;min-width:0;max-width:380px;padding:10px 12px;border-radius:var(--r-md);font-size:14px}
    .lc{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:1.5;color:var(--ink-2);cursor:pointer}
    .lc input[type=checkbox]{flex:none;width:18px;height:18px;margin:2px 0 0;padding:0;accent-color:var(--brand)}
    .rl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
    .rl:last-child{border-bottom:0;padding-bottom:0}
    .rl .meta{flex:1;min-width:0}
    .rl b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rl .btns{display:flex;gap:6px;flex:none}
    .gate{max-width:520px;margin:40px auto;text-align:center;padding:28px}
    @media(max-width:600px){.rl{flex-wrap:wrap}.rl .btns{width:100%}}
</style>
</head>
<body>
<div class="app">
    <aside class="side">
        <div class="brand"><span class="mk">e</span><span>eTIMS AutoInvoice</span></div>

        <div class="bizbox">
            <span class="biz-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
            <div>
                <div class="biz" id="who">Buyer</div>
                <span class="badge pin hide" id="pin"></span>
            </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <a class="helpcard" href="mailto:support@example.com">
            <span class="hc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1zM17 19c0 1.5-2 2-5 2"/></svg></span>
            <div><b>Need Help?</b><small>Contact Support</small></div>
            <svg class="hc-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <div class="sysbox">
            <i class="dot on"></i>
            <div><b>System Online</b><small id="updated">Last updated: &mdash;</small></div>
            <svg class="pulse" viewBox="0 0 48 20" aria-hidden="true"><path d="M0 10h12l4-8 6 16 5-12 3 4h18"/></svg>
        </div>
        <button class="out" id="logout">Sign out</button>
    </aside>

    <main class="main">
        <div class="top">
            <div class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="q" placeholder="Search purchases, receipts or reference...">
            </div>

            <div class="bellwrap">
                <button class="bell" id="bell" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                    <em id="bellCount" class="hide">0</em>
                </button>

                <div class="npop hide" id="npop" role="dialog" aria-label="Notifications">
                    <div class="np-head">
                        <b>Notifications</b>
                        <em class="count hide" id="nCount">0</em>
                        <button class="linkbtn" id="mar" type="button">Mark all read</button>
                    </div>
                    <ul class="notes" id="noteList"></ul>
                </div>
            </div>
        </div>

        <div class="content" id="app"></div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/buyer.js"></script>
</body>
</html>
