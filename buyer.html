<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buy | eTIMS AutoInvoice</title><style>body{font-family:Inter,Arial;margin:0;background:#f6f7f9;color:#17191d}.wrap{max-width:1000px;margin:auto;padding:30px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid #ddd;border-radius:9px;padding:14px}.primary{background:#c7192e;color:#fff;border:0;padding:10px 14px;border-radius:7px}.muted{color:#777}.pill{padding:4px 8px;border-radius:99px;background:#eee;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>eTIMS AutoInvoice</h1><p class="muted">Buy from a Masterclass merchant, pay by M-Pesa and track your receipt.</p><section class="card"><h2>Choose merchant</h2><select id="merchant" style="padding:10px;width:100%"></select><div id="catalog" class="grid" style="margin-top:15px"></div></section><section class="card"><h2>Your order</h2><div id="cart">Select items above.</div><button class="primary" id="create">Create order</button><div id="result"></div></section></main><script src="js/api.js"></script><script>const B={items:[],async init(){const r=await fetch(API.BASE+'/buyer/merchants');const d=await r.json();const s=document.getElementById('merchant');s.innerHTML=(d.merchants||[]).map(x=>`<option value="${x.id}">${x.trading_name}</option>`).join('');s.onchange=()=>this.load();await this.load()},async load(){const m=document.getElementById('merchant').value;if(!m)return;const r=await fetch(API.BASE+'/buyer/merchants/'+m+'/items');const d=await r.json();this.items=(d.items||[]).map(x=>({...x,qty:0}));document.getElementById('catalog').innerHTML=this.items.map((x,i)=>`<div class="item"><b>${x.name}</b><p>KES ${Number(x.unit_price).toFixed(2)}</p><button onclick="B.add(${i})">Add</button></div>`).join('');this.render()},add(i){this.items[i].qty++;this.render()},render(){const rows=this.items.filter(x=>x.qty);document.getElementById('cart').innerHTML=rows.length?rows.map(x=>`${x.name} × ${x.qty} — KES ${(x.qty*Number(x.unit_price)).toFixed(2)}`).join('<br>'):'Select items above.'},async create(){const items=this.items.filter(x=>x.qty).map(x=>({item_id:x.id,quantity:x.qty}));if(!localStorage.token){document.getElementById('result').innerHTML='<p class="muted">Sign in as a buyer first.</p>';return}const r=await API.post('/buyer/orders',{merchant_id:document.getElementById('merchant').value,items});document.getElementById('result').innerHTML=`<p><b>Order ${r.order.order_reference}</b></p><p>Paybill/Till: ${r.payment.shortcode||'Configured merchant shortcode'}<br>Account reference: <b>${r.payment.reference}</b><br>Amount: <b>KES ${Number(r.payment.amount).toFixed(2)}</b></p>`}};document.getElementById('create').onclick=()=>B.create();B.init();</script></body></html>
