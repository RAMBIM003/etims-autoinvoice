services:
  backend:
    build:
      context: ./backend
    container_name: etims-backend
    env_file: .env
    environment:
      PORT: 5000
    networks:
      - etims-internal
      - tender-scraper_default
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: etims-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - etims-internal
    restart: unless-stopped

networks:
  etims-internal:
    driver: bridge
  tender-scraper_default:
    external: true
