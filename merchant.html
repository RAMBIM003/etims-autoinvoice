<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant | eTIMS AutoInvoice</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/merchant.css">
</head>
<body>
<div class="app">
    <aside class="side">
        <div class="brand"><span class="mk">e</span><span>MASTERCLASS SOLUTIONS</span></div>
        <div class="product">eTIMS AUTOINVOICE</div>
        <div class="bizbox">
            <div>
                <div class="biz" id="business">Business</div>
                <span class="badge off" id="bizBadge">Active</span>
            </div>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sysbox"><i class="dot on"></i><div><b>System Online</b><small id="updated">Last updated: &mdash;</small></div></div>
        <button class="out" id="logout">Sign out</button>
    </aside>
    <main class="main">
        <div class="top">
            <div class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="q" placeholder="Search orders, invoices, payments or reference...">
            </div>
            <div class="status">
                <button class="bell" id="bell" type="button" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                    <em id="bellCount" class="hide">0</em>
                </button>
                <span class="st"><i class="dot" id="kraDot"></i><span><b>KRA eTIMS</b><small id="kraTxt">&mdash;</small></span></span>
                <span class="st"><i class="dot" id="mpDot"></i><span><b>M-Pesa</b><small id="mpTxt">&mdash;</small></span></span>
                <div class="user"><b class="avatar" id="avatar">M</b><span><b id="uname">Merchant</b><small>Merchant</small></span></div>
            </div>
        </div>
        <div class="content" id="app"></div>
    </main>
</div>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/merchant-app.js"></script>
<script src="js/merchant-dash.js"></script>
</body>
</html>
